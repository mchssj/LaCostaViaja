<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LaCostaViaja – Verificación de identidad</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.hero{background:url(./assets/787bb7fb2ce5ad01de42f60c4eab0825.png) center/cover no-repeat}
a{color:#0F6B72}a:hover{color:#0A3A3C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #DDF1F1; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">
<div class="hero" style="height: 150px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<div style="background: rgba(255,255,255,0.6); border-radius: 20px; padding: 12px 24px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<img src="./assets/33dc597327ae3be2c21531c4ae92566f.png" alt="La Costa – Estamos cerca" style="height: 84px; width: auto; display: block">
<span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: #0A3A3C">LaCostaViaja</span>
</div>
</div>
<div style="flex: 1; box-sizing: border-box; background: #FFFFFF; border-radius: 28px 28px 0 0; margin-top: -20px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #34454D">Paso 3 de 3</span>
<h2 style="margin: 0; font-size: 24px; font-weight: 700; color: #0A3A3C">Verificá tu identidad</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: #34454D">Necesario para viajes interurbanos por Ruta 11, horario nocturno o beneficios municipales. Para viajes urbanos cortos podés hacerlo más tarde.</p>
</div>
<div style="display: flex; gap: 12px">
<div style="width: 132px; flex: none; display: flex; flex-direction: column; gap: 6px">
<label for="tipodoc" style="font-size: 14px; font-weight: 600; color: #34454D">Tipo</label>
<select id="tipodoc" style="height: 52px; box-sizing: border-box; padding: 0 10px; border: 2px solid #4F5F67; border-radius: 12px; font-family: inherit; font-size: 16px; color: #0B2E3A; background: #FFFFFF">
<option>DNI</option>
<option>Pasaporte</option>
<option>Cédula</option>
<option>LC / LE</option>
</select>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="numdoc" style="font-size: 14px; font-weight: 600; color: #34454D">Número de documento</label>
<div style="display: flex; align-items: center; gap: 10px; height: 52px; box-sizing: border-box; padding: 0 14px; border: 2px solid #4F5F67; border-radius: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34454D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M14 10h4M14 14h4M6 16c.6-1.2 1.6-1.8 3-1.8s2.4.6 3 1.8"></path></svg>
<input id="numdoc" type="text" inputmode="numeric" placeholder="12.345.678" style="flex: 1; min-width: 0; border: 0; outline: 0; font-family: inherit; font-size: 16px; color: #0B2E3A; background: transparent">
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; color: #34454D">Fotos del documento</span>
<div style="display: flex; gap: 12px">
<label style="flex: 1; height: 112px; box-sizing: border-box; border: 2px dashed #4F5F67; border-radius: 14px; background: #F1F9F9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
<input type="file" accept="image/*" style="display: none">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #0F6B72; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
</span>
<span style="font-size: 14px; font-weight: 700; color: #0A3A3C">Frente</span>
<span style="font-size: 13px; color: #34454D">Subir o sacar foto</span>
</label>
<label style="flex: 1; height: 112px; box-sizing: border-box; border: 2px dashed #4F5F67; border-radius: 14px; background: #F1F9F9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
<input type="file" accept="image/*" style="display: none">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #0F6B72; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
</span>
<span style="font-size: 14px; font-weight: 700; color: #0A3A3C">Dorso</span>
<span style="font-size: 13px; color: #34454D">Subir o sacar foto</span>
</label>
</div>
<span style="font-size: 13px; color: #34454D">Que se vea completo, con buena luz y sin reflejos.</span>
</div>
<button type="button" style="height: 56px; border: 0; border-radius: 14px; background: #0F6B72; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Enviar documentación</button>
<button type="button" style="min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: #0F6B72; cursor: pointer">Omitir por ahora (solo viajes urbanos)</button>
<div style="flex: 1"></div>
</div>
</div>
</x-dc>
</body>
</html>
